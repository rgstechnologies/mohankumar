# Production / staging deployment — fully self-contained single-server stack.
# Works identically on a local server, a VPS, or any cloud VM with Docker.
#
# Usage:
#   cp .env.example .env   # then set strong secrets + NODE_ENV=production
#   docker compose -f docker-compose.prod.yml up -d --build
#
# To use a managed database instead of the bundled one, set DATABASE_URL
# in .env and remove the postgres service + depends_on entries.

name: bookly-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not exposed to the host network — only reachable by the api container.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy

  # Nightly pg_dump with retention — backups land in ./backups on the host
  # so copying them off-server (rsync/rclone) is one command. Restore with
  # scripts/pg-restore.sh.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./scripts/pg-backup.sh:/pg-backup.sh:ro
      # Dumps land here on the host. Keep this OUTSIDE the deploy/checkout
      # directory (set BACKUP_DIR to an absolute path) so root-owned dump files
      # don't break the CI runner's workspace cleanup. Defaults to ./backups.
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["sh", "/pg-backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # HTTPS config + Let's Encrypt certs (host /etc/letsencrypt, populated by
      # certbot). For plain-HTTP only, swap nginx-ssl.conf back to nginx.conf
      # and drop the 443 port + certs mount below.
      - ./docker/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/nginx/letsencrypt:ro
    depends_on:
      - api
      - web

volumes:
  pgdata:
  redisdata:
  storage:
