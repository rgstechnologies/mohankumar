# HTTPS nginx config (active in docker-compose.prod.yml).
#
# Production domain: erp.rgstechnologies.com — served with a real Let's Encrypt
# certificate mounted from the host's /etc/letsencrypt into the container at
# /etc/nginx/letsencrypt (see docker-compose.prod.yml).
#
# Re-issue / renew the cert on the server with:
#   docker compose -f docker-compose.prod.yml stop nginx
#   sudo certbot certonly --standalone -d erp.rgstechnologies.com
#   docker compose -f docker-compose.prod.yml start nginx
# Auto-renewal is handled by certbot's systemd timer on the host.

server {
    listen 80;
    server_name _;
    # Keep ACME HTTP-01 challenges working if/when you move to Let's Encrypt.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/letsencrypt/live/erp.rgstechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/letsencrypt/live/erp.rgstechnologies.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Real trusted cert now — enforce HTTPS for a year.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 40m;

    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
