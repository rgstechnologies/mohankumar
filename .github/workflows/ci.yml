name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: accountant
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: bookly_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accountant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://accountant:ci-password@localhost:5432/bookly_ci?schema=public
      DATABASE_URL: postgresql://accountant:ci-password@localhost:5432/bookly_ci?schema=public
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Build API
        run: npm run build -w apps/api

      - name: Build web
        run: npm run build -w apps/web

      - name: Run tests (unit + e2e)
        run: npm test -w apps/api
